server:
  port: 8080

spring:
  application:
    name: Awesome Pizza
  main:
    banner-mode: console
  datasource:
    url: jdbc:h2:mem:pizza-db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      # Loads the pizzas of a whole page of orders in one query instead of one per order
      hibernate.default_batch_fetch_size: 50

logging:
  level:
    root: INFO
    com.awesome.pizza: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n'

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
