server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: Awesome Pizza
  main:
    banner-mode: console
  datasource:
    url: jdbc:h2:file:./data/pizza-db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    root: INFO
    com.awesome.pizza: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n'

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui
